<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070707">
<title>Doom Fire</title>
<style>
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#070707;
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
  height:100dvh;
  image-rendering:pixelated;
}
</style>
</head>
<body>
<canvas id="fire" aria-label="Animated Doom fire"></canvas>
<script>
const BASE_GRID_ROWS = 60;
const BASE_MAX_INTENSITY = 36;
const TARGET_CELL_SIZE = 4;
const FIRE_HEIGHT_MULTIPLIER = 1.15;
const FRAME_TIME = 50;

const palette = [
  [0x07,0x07,0x07],[0x1F,0x07,0x07],[0x2F,0x0F,0x07],[0x47,0x0F,0x07],
  [0x57,0x17,0x07],[0x67,0x1F,0x07],[0x77,0x1F,0x07],[0x8F,0x27,0x07],
  [0x9F,0x2F,0x07],[0xAF,0x3F,0x07],[0xBF,0x47,0x07],[0xC7,0x47,0x07],
  [0xDF,0x4F,0x07],[0xDF,0x57,0x07],[0xDF,0x57,0x07],[0xD7,0x5F,0x07],
  [0xD7,0x5F,0x07],[0xD7,0x67,0x0F],[0xCF,0x6F,0x0F],[0xCF,0x77,0x0F],
  [0xCF,0x7F,0x0F],[0xCF,0x87,0x17],[0xC7,0x87,0x17],[0xC7,0x8F,0x17],
  [0xC7,0x97,0x1F],[0xBF,0x9F,0x1F],[0xBF,0x9F,0x1F],[0xBF,0xA7,0x27],
  [0xBF,0xA7,0x27],[0xBF,0xAF,0x2F],[0xB7,0xAF,0x2F],[0xB7,0xB7,0x2F],
  [0xB7,0xB7,0x37],[0xCF,0xCF,0x6F],[0xDF,0xDF,0x9F],[0xEF,0xEF,0xC7],
  [0xFF,0xFF,0xFF]
];

const canvas = document.getElementById('fire');
const context = canvas.getContext('2d', {alpha:false});
context.imageSmoothingEnabled = false;
let gridColumns = 0;
let gridRows = 0;
let maximumIntensity = BASE_MAX_INTENSITY;
let cells;
let frameImage;

function configureGrid() {
  const viewportWidth = Math.max(1, window.innerWidth);
  const viewportHeight = Math.max(1, window.innerHeight);
  gridRows = Math.max(BASE_GRID_ROWS, Math.ceil(viewportHeight / TARGET_CELL_SIZE));
  gridColumns = Math.max(1, Math.round(gridRows * viewportWidth / viewportHeight));
  maximumIntensity = Math.round(
    BASE_MAX_INTENSITY * gridRows / BASE_GRID_ROWS * FIRE_HEIGHT_MULTIPLIER
  );

  canvas.width = gridColumns * 2;
  canvas.height = gridRows;
  context.imageSmoothingEnabled = false;
  frameImage = context.createImageData(gridColumns * 2, gridRows);
  cells = new Uint16Array(gridColumns * gridRows);

  for (let column = 0; column < gridColumns; column++) {
    cells[(gridRows - 1) * gridColumns + column] = maximumIntensity;
  }
}

function spreadFire() {
  for (let row = 0; row < gridRows - 1; row++) {
    for (let column = 0; column < gridColumns; column++) {
      const offset = Math.floor(Math.random() * 3) - 1;
      let destinationColumn = column + offset;
      if (destinationColumn < 0) destinationColumn = 0;
      if (destinationColumn >= gridColumns) destinationColumn = gridColumns - 1;

      const below = cells[(row + 1) * gridColumns + column];
      const decay = Math.floor(Math.random() * 3);
      const intensity = Math.max(0, below - decay);
      cells[row * gridColumns + destinationColumn] = intensity;
    }
  }
}

function drawFire() {
  const pixels = frameImage.data;
  for (let row = 0; row < gridRows; row++) {
    for (let column = 0; column < gridColumns; column++) {
      const intensity = cells[row * gridColumns + column];
      const paletteIndex = Math.min(
        BASE_MAX_INTENSITY,
        Math.round(intensity * BASE_MAX_INTENSITY / maximumIntensity)
      );
      const color = palette[paletteIndex];
      const firstPixel = (row * gridColumns * 2 + column * 2) * 4;
      for (let copy = 0; copy < 2; copy++) {
        const pixel = firstPixel + copy * 4;
        pixels[pixel] = color[0];
        pixels[pixel + 1] = color[1];
        pixels[pixel + 2] = color[2];
        pixels[pixel + 3] = 255;
      }
    }
  }
  context.putImageData(frameImage, 0, 0);
}

function frame() {
  spreadFire();
  drawFire();
}

configureGrid();
frame();
setInterval(frame, FRAME_TIME);

let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    configureGrid();
    frame();
  }, 120);
});
</script>
</body>
</html>
