<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2a1a14">
<title>Autumn</title>
<style>
html,body{
  width:100%;
  height:100%;
  margin:0;
  overflow:hidden;
  background:#2a1a14;
}
canvas{
  display:block;
  width:100vw;
  height:100vh;
  height:100dvh;
  image-rendering:pixelated;
  cursor:pointer;
  touch-action:manipulation;
}
#hint{
  position:fixed;
  left:0;
  right:0;
  bottom:max(18px, env(safe-area-inset-bottom));
  text-align:center;
  font:500 13px/1.2 system-ui,-apple-system,"Segoe UI",sans-serif;
  color:rgba(255,255,255,.8);
  text-shadow:0 1px 3px rgba(0,0,0,.85);
  pointer-events:none;
  animation:fade 6s ease forwards;
}
@keyframes fade{0%,65%{opacity:1}100%{opacity:0}}
</style>
</head>
<body>
<canvas id="scene" aria-label="Animated autumn valley with falling leaves"></canvas>
<div id="hint">tap for a new valley</div>
<script>
'use strict';
// An autumn valley grown from random numbers, like the Doom fire.
// Hills are random ridges covered in random clusters of autumn leaves,
// trees are random branching, and the leaves fall, tumble in the wind
// and pile up on the meadow. Every load (and every tap) grows a new valley.

const STEP = 1000 / 30;
const canvas = document.getElementById('scene');
const ctx = canvas.getContext('2d', {alpha: false});

const rand = Math.random;
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const smooth = (a, b, v) => { const t = clamp((v - a) / (b - a), 0, 1); return t * t * (3 - 2 * t); };
const ri = (a, b) => a + Math.floor(rand() * (b - a + 1));

function hexRGB(h) { const n = parseInt(h.slice(1), 16); return [n >> 16 & 255, n >> 8 & 255, n & 255]; }
function pack(r, g, b) { return (0xff000000 | (b << 16) | (g << 8) | r) >>> 0; }
function hex(h) { const c = hexRGB(h); return pack(c[0], c[1], c[2]); }
function mix(a, b, t) {
  const ar = a & 255, ag = a >>> 8 & 255, ab = a >>> 16 & 255;
  return pack(
    ar + ((b & 255) - ar) * t | 0,
    ag + ((b >>> 8 & 255) - ag) * t | 0,
    ab + ((b >>> 16 & 255) - ab) * t | 0);
}
function shade(c, f) {
  return pack(
    Math.min(255, (c & 255) * f) | 0,
    Math.min(255, (c >>> 8 & 255) * f) | 0,
    Math.min(255, (c >>> 16 & 255) * f) | 0);
}
function ramp(stops, n) {
  const cs = stops.map(hexRGB), out = new Uint32Array(n);
  for (let i = 0; i < n; i++) {
    const p = i / (n - 1) * (cs.length - 1);
    const k = Math.min(cs.length - 2, Math.floor(p)), f = p - k;
    const a = cs[k], b = cs[k + 1];
    out[i] = pack(a[0] + (b[0] - a[0]) * f | 0, a[1] + (b[1] - a[1]) * f | 0, a[2] + (b[2] - a[2]) * f | 0);
  }
  return out;
}

// Smooth random noise: a grid of random numbers, blended between grid points.
function makeNoise() {
  const g = new Float32Array(256 * 256);
  for (let i = 0; i < g.length; i++) g[i] = rand();
  return function (x, y) {
    const xi = Math.floor(x), yi = Math.floor(y);
    const xf = x - xi, yf = y - yi;
    const u = xf * xf * (3 - 2 * xf), v = yf * yf * (3 - 2 * yf);
    const x0 = xi & 255, y0 = yi & 255, x1 = (x0 + 1) & 255, y1 = (y0 + 1) & 255;
    const a = g[y0 * 256 + x0], b = g[y0 * 256 + x1], c = g[y1 * 256 + x0], d = g[y1 * 256 + x1];
    return a + (b - a) * u + (c - a) * v + (a - b - c + d) * u * v;
  };
}
function fbm(n, x, y, oct) {
  let s = 0, amp = 0.5, f = 1, norm = 0;
  for (let o = 0; o < oct; o++) { s += amp * n(x * f, y * f); norm += amp; amp *= 0.5; f *= 2.03; }
  return s / norm;
}

// Autumn leaf colors, five shades each, dark to light. w = how often it is picked.
const LEAF = [
  {w: 2,   c: ['#3d0b0e', '#6e1218', '#a3201f', '#d23b27', '#f06a3c']}, // crimson
  {w: 2,   c: ['#4a1306', '#86260a', '#c2440f', '#ea6d1c', '#ff9a3d']}, // scarlet
  {w: 3,   c: ['#4d2205', '#8c4009', '#cc6a10', '#f29621', '#ffc04d']}, // orange
  {w: 3,   c: ['#4a3605', '#8a660a', '#c99a12', '#ecc531', '#fff08a']}, // gold
  {w: 1.2, c: ['#2f3a10', '#566a18', '#8c9a22', '#c3c23e', '#e8e483']}, // yellow-green
  {w: 1,   c: ['#2b0a18', '#511432', '#7e2349', '#ab3c62', '#d4677f']}, // maroon
  {w: 1.5, c: ['#3b1706', '#6e2c0c', '#a14716', '#c96a2c', '#e59552']}  // rust
].map(s => ({w: s.w, c: s.c.map(hex)}));
const GOLD = 3;
const LEAF_W = LEAF.reduce((s, l) => s + l.w, 0);
function pickLeaf() {
  let r = rand() * LEAF_W;
  for (let i = 0; i < LEAF.length; i++) { r -= LEAF[i].w; if (r <= 0) return i; }
  return 0;
}
function neighbourLeaf(i) { return clamp(i + (rand() < 0.5 ? -1 : 1), 0, LEAF.length - 1); }

const MOODS = [
  {sky: ['#3b2f6b', '#7a4f8f', '#d4708a', '#f59a6e', '#ffc98a', '#ffe7b8'], haze: '#f0b28e', sun: '#fff3d2', hill: '#5a3a3a'},
  {sky: ['#3d6596', '#7f9fc2', '#d9bc98', '#f3cf8a', '#ffe2a6', '#fff3d0'], haze: '#ecd0a2', sun: '#fffbe6', hill: '#5a4a32'},
  {sky: ['#2d2a55', '#5f4a85', '#b8668a', '#ec8a62', '#ffb46e', '#ffd99a'], haze: '#e9a07a', sun: '#ffeec0', hill: '#4a2e30'}
];

let W = 0, H = 0, N = 0, img, out;
let bg, fg, fgList, groundMask, meadowTop;
let mood, haze, sunC, lightDir, sunX, sunY;
let fgLeaves, twMark, tw;
let gN = 0, gX, gY, gH, gF, gL, gB, gT, gFl;
let leaves = [];
let time = 0, wind = 0, gust = 0, gustTarget = 0;

function cellFor(cw, ch) { return Math.max(2, Math.ceil(Math.max(cw, ch) / 500)); }

// ---------- growing the still parts ----------

function build() {
  const cw = Math.max(1, innerWidth), ch = Math.max(1, innerHeight);
  const cell = cellFor(cw, ch);
  W = Math.ceil(cw / cell); H = Math.ceil(ch / cell); N = W * H;
  canvas.width = W; canvas.height = H;
  img = ctx.createImageData(W, H);
  out = new Uint32Array(img.data.buffer);
  bg = new Uint32Array(N); fg = new Uint32Array(N);
  groundMask = new Uint8Array(N);
  twMark = new Uint8Array(N); tw = [];
  fgLeaves = []; leaves = [];

  mood = MOODS[(rand() * MOODS.length) | 0];
  haze = hex(mood.haze); sunC = hex(mood.sun);
  const treeLeft = rand() < 0.5;                  // the big tree on one side, the sun on the other
  sunX = W * (treeLeft ? 0.62 + rand() * 0.2 : 0.18 + rand() * 0.2);
  sunY = H * (0.3 + rand() * 0.08);
  lightDir = treeLeft ? 1 : -1;

  paintSky();
  paintHills();
  paintMeadow();
  paintMeadowTrees();
  paintRays();
  vignette(bg);
  paintForeground(treeLeft);
  vignette(fg);

  const list = [];
  for (let i = 0; i < N; i++) if (fg[i]) list.push(i);
  fgList = Int32Array.from(list);

  buildGrass();
  for (let k = 0; k < 120; k++) update();   // let some leaves be in the air on the first frame
}

function paintSky() {
  const sky = ramp(mood.sky, 256), n = makeNoise();
  const m = Math.min(W, H), sunR = Math.max(2.5, m * 0.035), glowR = m * 0.3;
  const horizon = H * 0.62;
  const dark = mix(sky[60], hex('#4a3048'), 0.45);
  for (let y = 0; y < H; y++) {
    const base = sky[clamp(Math.round(y / horizon * 255), 0, 255)];
    for (let x = 0; x < W; x++) {
      const dx = x - sunX, dy = (y - sunY) * 1.2, d = Math.sqrt(dx * dx + dy * dy);
      let c = mix(base, sunC, Math.exp(-d / glowR) * 0.65);
      if (d < sunR) c = sunC;
      const cl = fbm(n, x * 0.008, y * 0.045, 5);
      const a = smooth(0.55, 0.75, cl) * (1 - smooth(horizon * 0.6, horizon, y));
      if (a > 0) {
        let cc = mix(dark, haze, clamp(0.3 + y / horizon * 0.6 + (cl - 0.6) * 2, 0, 1));
        cc = mix(cc, sunC, Math.exp(-d / (glowR * 0.55)) * 0.8);   // cloud edges lit by the sun
        c = mix(c, cc, a * 0.85);
      }
      bg[y * W + x] = c;
    }
  }
}

// Rolling hills, far to near. Each is a random ridge covered in clusters of
// autumn leaves; the far ones fade into the haze, and fog sits in the valleys.
function paintHills() {
  const layers = 4;
  const hillBase = hex(mood.hill);
  for (let k = 0; k < layers; k++) {
    const depth = k / (layers - 1);                 // 0 = far, 1 = near
    const n = makeNoise(), region = makeNoise();
    const base = H * (0.44 + depth * 0.2), amp = H * (0.11 - depth * 0.04);
    const hz = 0.62 - depth * 0.5;
    const ridge = new Float32Array(W);
    for (let x = 0; x < W; x++) ridge[x] = base - fbm(n, x * (0.005 + depth * 0.004) + k * 31, k * 7.7, 4) * amp * 2;
    // the hillside itself, dark under the trees
    const ground = mix(hillBase, haze, hz);
    for (let x = 0; x < W; x++) {
      for (let y = Math.max(0, Math.round(ridge[x])); y < H; y++) bg[y * W + x] = ground;
    }
    // tree crowns all over the hillside; colours come in patches, like a real forest
    const r = 1.4 + depth * 4.2, stepX = Math.max(1, r * 0.95), stepY = Math.max(1, r * 0.8);
    const bottom = Math.min(H, base + H * 0.16);
    for (let x = -r; x < W + r; x += stepX) {
      const xi = clamp(Math.round(x), 0, W - 1);
      for (let y = ridge[xi] + r * 0.3; y < bottom; y += stepY) {
        const px = x + (rand() - 0.5) * r, py = y + (rand() - 0.5) * r * 0.6;
        const li = rand() < 0.75 ? Math.min(LEAF.length - 1, (region(px * 0.03 + k * 9, py * 0.05) * LEAF.length) | 0) : pickLeaf();
        const fade = hz + smooth(base - amp, bottom, py) * 0.08;
        foliage(bg, px, py, r * (0.75 + rand() * 0.45), LEAF[li].c, LEAF[neighbourLeaf(li)].c, fade, null);
      }
    }
    // fog at the foot of this hill; the next hill covers the lower part
    if (k < layers - 1) {
      const f0 = base - amp * 0.4, f1 = base + H * 0.07;
      for (let y = Math.max(0, Math.round(f0)); y < Math.min(H, f1); y++) {
        const f = smooth(f0, f1, y) * (0.55 - depth * 0.25);
        for (let x = 0; x < W; x++) bg[y * W + x] = mix(bg[y * W + x], haze, f);
      }
    }
  }
}

function paintMeadow() {
  const n = makeNoise(), n2 = makeNoise();
  const G = ramp(['#3a2a12', '#5c4418', '#806224', '#a3822f', '#c29e3e', '#dbbb5a'], 64);
  const russet = hex('#8a3a18');
  meadowTop = new Int16Array(W);
  for (let x = 0; x < W; x++) meadowTop[x] = Math.round(H * 0.74 - fbm(n, x * 0.006, 4.5, 3) * H * 0.06);
  for (let x = 0; x < W; x++) {
    for (let y = meadowTop[x]; y < H; y++) {
      const i = y * W + x;
      const near = (y - meadowTop[x]) / (H - meadowTop[x]);
      let c = G[clamp(Math.round((0.3 + fbm(n2, x * 0.06, y * 0.18, 4) * 0.6 + (1 - near) * 0.15) * 63), 0, 63)];
      const p = n(x * 0.03 + 40, y * 0.08 + 40);
      if (p > 0.6) c = mix(c, russet, (p - 0.6) * 1.8);
      if (rand() < 0.06 + near * 0.1) c = LEAF[ri(0, LEAF.length - 1)].c[ri(1, 4)];   // fallen leaves
      if (y - meadowTop[x] < 1) c = shade(c, 1.15);
      bg[i] = mix(c, haze, (1 - near) * 0.25);
      groundMask[i] = 1;
    }
  }
}

function paintMeadowTrees() {
  for (let k = ri(2, 4); k > 0; k--) {
    const x = ri(0, W - 1);
    tree(bg, x, meadowTop[x] + ri(1, Math.max(2, Math.round(H * 0.03))), H * (0.1 + rand() * 0.1), (rand() - 0.5) * 0.2, 0.15, null, 5);
  }
}

// Soft beams of light from the sun.
function paintRays() {
  const n = makeNoise();
  const reach = Math.hypot(W, H);
  for (let y = 0; y < H; y++) {
    for (let x = 0; x < W; x++) {
      const dx = x - sunX, dy = y - sunY;
      const d = Math.hypot(dx, dy);
      const ang = Math.atan2(dy, dx);
      const beam = smooth(0.55, 0.8, n(Math.cos(ang) * 3 + 50, Math.sin(ang) * 3 + 50));
      const a = beam * 0.16 * (1 - d / reach) * smooth(0, H * 0.08, d);
      if (a > 0.005) bg[y * W + x] = mix(bg[y * W + x], sunC, a);
    }
  }
}

function paintForeground(treeLeft) {
  const size = Math.min(H * 0.78, W * 0.7);
  // the big tree, a third of the way in
  const bx = Math.round(W * (treeLeft ? 0.22 + rand() * 0.1 : 0.68 + rand() * 0.1));
  tree(fg, bx, H - ri(1, Math.round(H * 0.04)), size * (0.9 + rand() * 0.15), (treeLeft ? 1 : -1) * rand() * 0.08, 0, fgLeaves, 7);
  // a smaller tree half out of the frame on the other side
  const sx = treeLeft ? W - 1 - ri(0, Math.round(W * 0.06)) : ri(0, Math.round(W * 0.06));
  tree(fg, sx, H + 2, size * (0.55 + rand() * 0.15), (treeLeft ? -1 : 1) * 0.08, 0, fgLeaves, 6);
  // bright bushes across the meadow
  for (let k = ri(3, 6); k > 0; k--) {
    const x = ri(0, W - 1), yb = ri(Math.round(H * 0.82), H - 1);
    const li = pickLeaf(), r = H * (0.015 + rand() * 0.02);
    const pal = LEAF[li].c, pal2 = LEAF[neighbourLeaf(li)].c;
    for (let j = ri(4, 7); j > 0; j--) {
      foliage(fg, x + (rand() - 0.5) * r * 2.6, yb - rand() * r * 1.6, r * (0.6 + rand() * 0.5), pal, pal2, 0, fgLeaves);
    }
  }
}

function vignette(L) {
  for (let y = 0; y < H; y++) {
    const dy = (y / H - 0.5) * 2;
    for (let x = 0; x < W; x++) {
      const i = y * W + x;
      if (!L[i]) continue;
      const dx = (x / W - 0.5) * 2;
      L[i] = shade(L[i], 1 - 0.3 * Math.pow((dx * dx + dy * dy) * 0.5, 1.5));
    }
  }
}

// A tree: a trunk that splits again and again at random angles; leaf clusters at the tips.
function tree(L, x, y, h, lean, hz, list, depth) {
  const li = pickLeaf();
  const birch = (li === GOLD && rand() < 0.4) || rand() < 0.06;
  const bark = (birch ? ['#6f685c', '#c9c2b2', '#ebe5d6'] : ['#1f140d', '#3a281b', '#5a412b'])
    .map(c => hz ? mix(hex(c), haze, hz) : hex(c));
  const T = {
    L, bark, birch, hz, list,
    pal: LEAF[li].c, pal2: LEAF[neighbourLeaf(li)].c,
    leafR: h * (depth >= 7 ? 0.055 : depth === 6 ? 0.065 : 0.08)
  };
  branch(T, x, y, -Math.PI / 2 + lean, h * 0.32, Math.max(1, h * 0.05), depth);
}

function branch(T, x, y, ang, len, th, depth) {
  const ex = x + Math.cos(ang) * len, ey = y + Math.sin(ang) * len;
  stroke(T, x, y, ex, ey, th);
  if (depth <= 0) {
    foliage(T.L, ex, ey, T.leafR * (0.7 + rand() * 0.6), T.pal, T.pal2, T.hz, T.list);
    return;
  }
  const n = rand() < 0.35 ? 3 : 2;
  for (let k = 0; k < n; k++) {
    const spread = n === 2 ? (k === 0 ? -1 : 1) * (0.25 + rand() * 0.35) : (k - 1) * (0.35 + rand() * 0.25);
    const a = lerp(ang + spread + (rand() - 0.5) * 0.25, -Math.PI / 2, 0.12);
    branch(T, ex, ey, a, len * (0.66 + rand() * 0.16), th * 0.68, depth - 1);
  }
  if (depth <= 2 && rand() < 0.5) foliage(T.L, ex, ey, T.leafR * 0.8, T.pal, T.pal2, T.hz, T.list);
}

function stroke(T, x0, y0, x1, y1, th) {
  const n = Math.ceil(Math.hypot(x1 - x0, y1 - y0)) + 1;
  const r = th / 2, R = Math.ceil(r);
  for (let s = 0; s <= n; s++) {
    const f = s / n, px = x0 + (x1 - x0) * f, py = y0 + (y1 - y0) * f;
    for (let dy = -R; dy <= R; dy++) {
      for (let dx = -R; dx <= R; dx++) {
        if (dx * dx + dy * dy > r * r + 0.6) continue;
        const X = Math.round(px + dx), Y = Math.round(py + dy);
        if (X < 0 || X >= W || Y < 0 || Y >= H) continue;
        const side = dx / (r + 0.5) * lightDir;
        let c = side > 0.3 ? T.bark[2] : side < -0.35 ? T.bark[0] : T.bark[1];
        if (T.birch && rand() < 0.08) c = T.bark[0];
        T.L[Y * W + X] = c;
      }
    }
  }
}

function foliage(L, x0, y0, r, pal, pal2, hz, list) {
  const p = rand() < 0.3 ? pal2 : pal;
  const R = Math.ceil(r), rr = r * r, inner = r * r * 0.42;
  for (let dy = -R; dy <= R; dy++) {
    for (let dx = -R; dx <= R; dx++) {
      const d2 = dx * dx + dy * dy;
      if (d2 > rr) continue;
      if (d2 > inner && rand() < 0.45) continue;   // ragged edge
      if (rand() < 0.1) continue;                  // gaps between leaves
      const X = Math.round(x0 + dx), Y = Math.round(y0 + dy);
      if (X < 0 || X >= W || Y < 0 || Y >= H) continue;
      const light = (dx * lightDir * 0.55 - dy * 0.85) / r;
      let c = p[clamp(Math.round(2 + light * 1.5 + (rand() - 0.5) * 1.6), 0, 4)];
      if (hz) c = mix(c, haze, hz);
      const i = Y * W + X;
      L[i] = c;
      if (list) list.push(i);
    }
  }
}

function buildGrass() {
  const base = ['#5c4b1c', '#7a6526', '#9a8034', '#b89a45', '#cdb25a', '#8a4a22', '#6a6a2a', '#a8652c'].map(hex);
  const flowers = ['#9b6fd6', '#f0c234', '#f3efe6', '#d9483b'].map(hex);
  const area = W * H * 0.26;
  const target = Math.round(area * 0.08);
  gX = new Float32Array(target); gY = new Int16Array(target); gH = new Float32Array(target);
  gF = new Float32Array(target); gL = new Float32Array(target);
  gB = new Uint32Array(target); gT = new Uint32Array(target); gFl = new Uint32Array(target);
  gN = 0;
  for (let tries = 0; tries < target * 4 && gN < target; tries++) {
    const x = (rand() * W) | 0, top = meadowTop[x];
    const y = Math.round(top + 2 + (H - top - 2) * Math.sqrt(rand()));
    if (y >= H || !groundMask[y * W + x]) continue;
    const near = (y - top) / (H - top);
    const b = base[(rand() * base.length) | 0];
    gX[gN] = x; gY[gN] = y; gH[gN] = 1.5 + near * H * 0.055 * (0.4 + rand() * 0.9);
    gF[gN] = 0.5 + rand() * 0.7; gL[gN] = (rand() - 0.5) * 0.5;
    gB[gN] = b; gT[gN] = shade(b, 1.3);
    gFl[gN] = rand() < 0.06 ? flowers[(rand() * flowers.length) | 0] : 0;
    gN++;
  }
}

// ---------- the moving parts ----------

function spawnLeaf(burst) {
  if (!fgLeaves.length) return;
  const i = fgLeaves[(rand() * fgLeaves.length) | 0];
  const c = fg[i];
  if (!c) return;
  const x = i % W, y = (i / W) | 0;
  const top = meadowTop[clamp(x, 0, W - 1)];
  leaves.push({
    x, y, vy: 0.2 + rand() * 0.35 + (burst ? 0.1 : 0), ph: rand() * 6.28, dph: 0.05 + rand() * 0.1,
    sway: 0.3 + rand() * 0.4, c, c2: shade(c, 0.6), big: rand() < 0.45,
    ty: Math.max(y + 6, top + rand() * (H - top + 8))
  });
}

function updateLeaves() {
  let r = 0.35 + Math.abs(wind) * 1.4;
  const max = Math.round(W * 0.4);
  while (r > 0) { if (rand() < r && leaves.length < max) spawnLeaf(Math.abs(wind) > 0.6); r -= 1; }
  for (let k = leaves.length - 1; k >= 0; k--) {
    const l = leaves[k];
    l.ph += l.dph;
    l.x += wind * 0.9 + Math.sin(l.ph) * l.sway;
    l.y += l.vy * (0.5 + 0.5 * Math.abs(Math.cos(l.ph)));
    let gone = l.x < -5 || l.x > W + 5 || l.y > H + 2;
    if (!gone && l.y >= l.ty) {
      const xi = l.x | 0, yi = l.y | 0;
      if (xi >= 0 && xi < W && yi >= 0 && yi < H && groundMask[yi * W + xi]) {
        bg[yi * W + xi] = l.c;                         // it lands and stays on the meadow
        if (l.big && xi + 1 < W && groundMask[yi * W + xi + 1]) bg[yi * W + xi + 1] = l.c2;
      }
      gone = true;
    }
    if (gone) { leaves[k] = leaves[leaves.length - 1]; leaves.pop(); }
  }
}

// Leaves catching the light: a few random leaves brighten for a moment, more when the wind blows.
function twinkle() {
  for (let k = tw.length - 1; k >= 0; k--) {
    const t = tw[k];
    if (--t.ttl <= 0) { fg[t.i] = t.c; twMark[t.i] = 0; tw[k] = tw[tw.length - 1]; tw.pop(); }
  }
  if (!fgLeaves.length) return;
  const n = Math.round(W / 40 + Math.abs(wind) * W / 15);
  for (let k = 0; k < n; k++) {
    const i = fgLeaves[(rand() * fgLeaves.length) | 0];
    if (twMark[i]) continue;
    twMark[i] = 1;
    tw.push({i, c: fg[i], ttl: ri(2, 8)});
    fg[i] = shade(fg[i], 1.35);
  }
}

function update() {
  time += STEP / 1000;
  if (rand() < 0.004) gustTarget = (rand() - 0.35) * 1.5;
  gustTarget *= 0.996;
  gust += (gustTarget - gust) * 0.03;
  wind = 0.25 * Math.sin(time * 0.23) + 0.15 * Math.sin(time * 0.61 + 1.3) + gust;
  updateLeaves();
  twinkle();
}

// ---------- drawing a frame ----------

function drawGrass() {
  for (let b = 0; b < gN; b++) {
    const h = gH[b], steps = Math.max(1, Math.round(h));
    const bend = (gL[b] + (wind + Math.sin(time * 2.1 + gX[b] * 0.19 + gY[b] * 0.07) * 0.3) * gF[b]) * h * 0.6;
    let px = 0, py = 0;
    for (let s = 0; s <= steps; s++) {
      const f = s / steps;
      px = Math.round(gX[b] + bend * f * f);
      py = gY[b] - s;
      if (px < 0 || px >= W || py < 0) continue;
      out[py * W + px] = f > 0.55 ? gT[b] : gB[b];
    }
    const fl = gFl[b];
    if (fl && px >= 0 && px < W && py >= 0) {
      out[py * W + px] = fl;
      if (py > 0) out[(py - 1) * W + px] = fl;
    }
  }
}

function drawLeaves() {
  for (let k = 0; k < leaves.length; k++) {
    const l = leaves[k];
    const x = Math.round(l.x), y = Math.round(l.y);
    if (x < 0 || x >= W || y < 0 || y >= H) continue;
    const c = Math.sin(l.ph) > 0 ? l.c : l.c2;          // the two sides of a tumbling leaf
    out[y * W + x] = c;
    if (l.big && x + 1 < W) out[y * W + x + 1] = c;
  }
}

function render() {
  out.set(bg);
  for (let k = 0; k < fgList.length; k++) { const i = fgList[k]; out[i] = fg[i]; }
  drawGrass();
  drawLeaves();
  ctx.putImageData(img, 0, 0);
}

let last = 0, acc = 0;
function loop(now) {
  requestAnimationFrame(loop);
  if (!last) last = now;
  acc += Math.min(200, now - last);
  last = now;
  if (acc < STEP) return;
  while (acc >= STEP) { update(); acc -= STEP; }
  render();
}

build();
render();
requestAnimationFrame(loop);

canvas.addEventListener('click', () => { build(); render(); });
addEventListener('keydown', e => { if (e.key === ' ' || e.key === 'Enter') { build(); render(); } });

let resizeTimer;
addEventListener('resize', () => {
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    const cw = Math.max(1, innerWidth), ch = Math.max(1, innerHeight), c = cellFor(cw, ch);
    const nw = Math.ceil(cw / c), nh = Math.ceil(ch / c);
    if (Math.abs(nw - W) > W * 0.08 || Math.abs(nh - H) > H * 0.08) { build(); render(); }
  }, 200);
});
</script>
</body>
</html>
